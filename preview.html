<script>
(function () {
  var GRID = '#F2F3F5', LABEL = '#9CA3AF', TEXT = '#1A1A1A';
  var INCOME = '#639922', EXPENSE = '#E24B4A';

  function compact(fen) {
    var y = Math.abs(fen) / 100;
    if (y >= 1e8) return (y / 1e8).toFixed(1) + '亿';
    if (y >= 1e4) return (y / 1e4).toFixed(1) + '万';
    if (y >= 1000) return Math.round(y) + '';
    return y.toFixed(y % 1 === 0 ? 0 : 1);
  }

  function setup(id, w, h, draw) {
    var canvas = document.getElementById(id);
    if (!canvas) return;
    var dpr = window.devicePixelRatio || 2;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.height = h + 'px';
    var ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    draw(ctx, w, h);
  }

  function roundRect(ctx, x, y, w, h, r) {
    if (h <= 0 || w <= 0) return;
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
    ctx.fill();
  }

  /* ---------- 环形图 ---------- */
  var pieData = [
    { name: '材料费', color: '#378add', total: 13616400, percent: 42 },
    { name: '人工费', color: '#1d9e75', total: 8429200, percent: 26 },
    { name: '机械租赁', color: '#ef9f27', total: 3890400, percent: 12 },
    { name: '运输费', color: '#d4537e', total: 2593600, percent: 8 },
    { name: '安全措施', color: '#7f77dd', total: 1945200, percent: 6 },
    { name: '其他支出', color: '#b4b2a9', total: 1945200, percent: 6 }
  ];

  setup('pie', 327, 190, function (ctx, w, h) {
    var total = pieData.reduce(function (s, d) { return s + d.total; }, 0);
    var cx = w / 2, cy = h / 2;
    var r = Math.min(w, h) / 2 - 6;
    var lw = Math.max(16, r * 0.46);
    var start = -Math.PI / 2;
    var gap = 0.012;
    pieData.forEach(function (d) {
      var angle = d.total / total * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(cx, cy, r - lw / 2, start, start + Math.max(angle - gap, 0.004));
      ctx.strokeStyle = d.color;
      ctx.lineWidth = lw;
      ctx.stroke();
      start += angle;
    });
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = LABEL;
    ctx.font = '11px sans-serif';
    ctx.fillText('总支出', cx, cy - 14);
    ctx.fillStyle = TEXT;
    ctx.font = '500 17px sans-serif';
    ctx.fillText(compact(total), cx, cy + 8);
  });

  /* ---------- 柱状图 ---------- */
  var bars = [
    { label: '4月', income: 12000000, expense: 5200000 },
    { label: '5月', income: 9800000, expense: 6800000 },
    { label: '6月', income: 16000000, expense: 4500000 },
    { label: '7月', income: 0, expense: 3800000 },
    { label: '8月', income: 0, expense: 7560000 },
    { label: '9月', income: 8000000, expense: 4560000 }
  ];

  setup('bar', 327, 170, function (ctx, w, h) {
    var padTop = 26, padBottom = 22, padSide = 4;
    var max = 0;
    bars.forEach(function (d) {
      if (d.income > max) max = d.income;
      if (d.expense > max) max = d.expense;
    });
    var step = Math.pow(10, Math.floor(Math.log10(max / 100)));
    var top = Math.ceil(max / 100 / step) * step * 100;
    var chartH = h - padTop - padBottom;
    var groupW = (w - padSide * 2) / bars.length;
    var barW = Math.min(13, groupW * 0.3);
    var gapInner = 4;

    ctx.strokeStyle = GRID;
    ctx.lineWidth = 1;
    ctx.fillStyle = LABEL;
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    [0, 0.5, 1].forEach(function (ratio) {
      var y = padTop + chartH * ratio;
      ctx.beginPath();
      ctx.moveTo(padSide, Math.round(y) + 0.5);
      ctx.lineTo(w - padSide, Math.round(y) + 0.5);
      ctx.stroke();
      ctx.fillText(compact(top * (1 - ratio)), padSide + 2, y - 8);
    });

    bars.forEach(function (d, i) {
      var cx = padSide + groupW * i + groupW / 2;
      var x1 = cx - gapInner / 2 - barW;
      var x2 = cx + gapInner / 2;
      var hI = d.income / top * chartH;
      var hE = d.expense / top * chartH;
      if (d.income > 0) { ctx.fillStyle = INCOME; roundRect(ctx, x1, padTop + chartH - hI, barW, hI, 2); }
      if (d.expense > 0) { ctx.fillStyle = EXPENSE; roundRect(ctx, x2, padTop + chartH - hE, barW, hE, 2); }
      ctx.fillStyle = LABEL;
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(d.label, cx, padTop + chartH + 6);
    });
  });
})();
